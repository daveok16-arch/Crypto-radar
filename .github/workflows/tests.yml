name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package targets >=3.10; test the floor and a current release.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      # The suite is written to run entirely offline. If an import ever starts
      # requiring network access, this fails the job rather than passing
      # locally and breaking for everyone else.
      - name: Verify the package imports
        run: python -c "import dormant_radar, dormant_radar.cli, dormant_radar.api"